[package]
name = "zcall-media"
version = "0.1.0"
edition = "2021"
description = "Media layer of the native Zalo call engine: ZRTP packets, SRTP, RTP/RTCP, send-rate (port of native-engine/*.js)"
license = "BSD-3-Clause"
authors = ["Việt Nam Linux Family"]

[lib]
path = "src/lib.rs"

# The media process (ZCALL_MEDIA=rust): replaces backends/zrtc-media.js for 1-1 calls
# (audio, video, screen share); group calls stay on zrtc-media.js.
[[bin]]
name = "zcall-media"
path = "src/main.rs"

[dependencies]
aes = "0.8"
hmac = "0.12"
sha1 = "0.10"
# preserve_order: JSON in log lines keeps the key order JSON.stringify gives.
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"

[dev-dependencies]
# Exact float parsing: the vectors hold JS timestamps down to the last bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
